name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # Use Node version
            nvm use 24

            # Debug (optional)
            node -v
            npm -v

            # Deploy
            cd /var/www/html/study-cafe-web
            git pull origin main
            npm install
            npm run build

            # Restart or start app
            pm2 restart studycafe-web || pm2 start npm --name "studycafe-web" -- start -- -p 3001

            # Save PM2 process
            pm2 save